---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: lilocharge
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: lilocharge
spec:
  # Run daily at 2 AM Yerevan time (UTC+4, so 22:00 UTC)
  schedule: '0 22 * * *'
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-backup
        app.kubernetes.io/component: backup
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: backup
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  BACKUP_FILE="/backups/lilocharge-$(date +%Y%m%d-%H%M%S).sql.gz"
                  echo "Creating backup: ${BACKUP_FILE}"
                  pg_dump -h postgres.lilocharge.svc.cluster.local \
                    -U ${POSTGRES_USER} \
                    -d ${POSTGRES_DB} \
                    --no-owner --no-acl \
                    | gzip > ${BACKUP_FILE}
                  echo "Backup completed: ${BACKUP_FILE}"

                  # Keep only last 30 days of backups
                  find /backups -name "lilocharge-*.sql.gz" -mtime +30 -delete

                  echo "Old backups cleaned up."
              env:
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: database
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: password
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
              resources:
                requests:
                  memory: '256Mi'
                  cpu: '100m'
                limits:
                  memory: '512Mi'
                  cpu: '500m'
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: postgres-backup-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: lilocharge
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: lilocharge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
