---
apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate
  namespace: lilocharge
  labels:
    app.kubernetes.io/name: prisma-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: lilocharge
spec:
  ttlSecondsAfterFinished: 86400 # Clean up after 24 hours
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prisma-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres.lilocharge.svc.cluster.local 5432; do
                echo "Waiting for postgres..."
                sleep 2
              done
      containers:
        - name: migrate
          image: lilocharge/api:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              echo "Running Prisma migrations..."
              cd /app/apps/api
              # Use the pinned Prisma CLI baked into the image (npm install -g
              # prisma@5.x in apps/api/Dockerfile), NOT `npx prisma`, which would
              # download the latest major (v6) at runtime and mismatch @prisma/client v5.
              # For a pre-existing (non-empty) database that predates Prisma's
              # migration history, baseline it first so `migrate deploy` does not
              # P3005 — see docs/DEPLOYMENT.md §7:
              #   prisma migrate resolve --applied 20260217150000_init
              prisma migrate deploy
              echo "Migrations completed successfully."
          env:
            - name: POSTGRES_HOST
              value: postgres.lilocharge.svc.cluster.local
            - name: POSTGRES_PORT
              value: '5432'
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: DATABASE_URL
              value: 'postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?schema=public'
          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'
