---
# PostgreSQL Credentials Secret Template
# In production, use sealed-secrets or external-secrets-operator
# This is a template - DO NOT commit actual credentials
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: lilocharge
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: lilocharge
type: Opaque
stringData:
  username: 'lilocharge'
  password: 'REPLACE_WITH_SEALED_SECRET'
  database: 'lilocharge'
---
# Redis Credentials Secret Template
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: lilocharge
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: lilocharge
type: Opaque
stringData:
  password: 'REPLACE_WITH_SEALED_SECRET'
---
# API Secrets Template
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: lilocharge
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: lilocharge
type: Opaque
stringData:
  # ── Auth (REQUIRED — API 500s on every login without refresh-token-secret) ──
  jwt-secret: 'REPLACE_WITH_SEALED_SECRET'
  refresh-token-secret: 'REPLACE_WITH_SEALED_SECRET'

  # ── Payments: ArCa (REQUIRED — callbacks 503 without the webhook secret) ────
  arca-api-key: 'REPLACE_WITH_SEALED_SECRET'
  arca-merchant-id: 'REPLACE_WITH_SEALED_SECRET'
  arca-webhook-secret: 'REPLACE_WITH_SEALED_SECRET'

  # ── Payments: Idram (REQUIRED — callbacks 503 without the webhook secret) ───
  idram-api-key: 'REPLACE_WITH_SEALED_SECRET'
  idram-webhook-secret: 'REPLACE_WITH_SEALED_SECRET'

  # ── Payments: Apple Pay / Google Pay (per-gateway API keys) ─────────────────
  apple-pay-api-key: 'REPLACE_WITH_SEALED_SECRET'
  google-pay-api-key: 'REPLACE_WITH_SEALED_SECRET'

  # ── SMS / OTP (Twilio-compatible; REQUIRED in prod or registration is dead) ─
  twilio-account-sid: 'REPLACE_WITH_SEALED_SECRET'
  twilio-auth-token: 'REPLACE_WITH_SEALED_SECRET'
  sms-from-number: '+374REPLACE_ME'

  # ── Push notifications (Firebase Admin service account) ─────────────────────
  # fcm-private-key is the \n-escaped PEM from the service-account JSON.
  fcm-project-id: 'REPLACE_WITH_SEALED_SECRET'
  fcm-client-email: 'REPLACE_WITH_SEALED_SECRET'
  fcm-private-key: 'REPLACE_WITH_SEALED_SECRET'

  # ── Uploads (S3-compatible presigning; endpoints 503 when unset) ────────────
  uploads-s3-access-key-id: 'REPLACE_WITH_SEALED_SECRET'
  uploads-s3-secret-access-key: 'REPLACE_WITH_SEALED_SECRET'

  # ── Observability ───────────────────────────────────────────────────────────
  sentry-dsn: 'REPLACE_WITH_SEALED_SECRET'

  # JSON map of OCPP charge-point identity -> HTTP Basic secret, consumed as
  # OCPP_IDENTITY_SECRETS when OCPP_AUTH_MODE=basic. The placeholder is valid JSON that
  # rejects every real charge point until replaced with sealed per-station secrets.
  ocpp-identity-secrets: '{"REPLACE_WITH_CHARGE_POINT_ID":"REPLACE_WITH_SEALED_SECRET"}'
