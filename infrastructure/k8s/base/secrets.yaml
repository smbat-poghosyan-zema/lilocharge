---
# PostgreSQL Credentials Secret Template
# In production, use sealed-secrets or external-secrets-operator
# This is a template - DO NOT commit actual credentials
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: lilocharge
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: lilocharge
type: Opaque
stringData:
  username: 'lilocharge'
  password: 'REPLACE_WITH_SEALED_SECRET'
  database: 'lilocharge'
---
# Redis Credentials Secret Template
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: lilocharge
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: lilocharge
type: Opaque
stringData:
  password: 'REPLACE_WITH_SEALED_SECRET'
---
# API Secrets Template
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: lilocharge
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: lilocharge
type: Opaque
stringData:
  jwt-secret: 'REPLACE_WITH_SEALED_SECRET'
  arca-merchant-id: 'REPLACE_WITH_SEALED_SECRET'
  idram-api-key: 'REPLACE_WITH_SEALED_SECRET'
  mapbox-token: 'REPLACE_WITH_SEALED_SECRET'
  fcm-server-key: 'REPLACE_WITH_SEALED_SECRET'
  sentry-dsn: 'REPLACE_WITH_SEALED_SECRET'
