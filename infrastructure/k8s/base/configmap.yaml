---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: lilocharge
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: lilocharge
data:
  # Application settings
  NODE_ENV: 'production'
  PORT: '3000'
  LOG_LEVEL: 'info'
  APP_NAME: 'lilocharge-api'
  # Sentry release tag. Override per release via the overlay (kustomize edit) so it
  # matches the deployed image tag; the placeholder keeps releases labelled otherwise.
  APP_VERSION: '1.0.0'

  # CORS — comma-separated browser origins allowed to call the API and the
  # Socket.IO session-monitoring gateway (which reads CORS_ORIGIN directly).
  # '*' allows all; never use '*' with credentialed requests.
  CORS_ORIGIN: 'https://app.lilocharge.am,https://www.lilocharge.am'

  # Auth token lifetimes / OTP + refresh-session TTLs (secrets live in api-secrets)
  JWT_EXPIRY: '15m'
  REFRESH_TOKEN_EXPIRY: '30d'
  AUTH_OTP_TTL_SECONDS: '300'
  AUTH_REFRESH_SESSION_TTL_SECONDS: '2592000'

  # SMS / OTP delivery (Twilio-compatible). MUST be 'true' in production or OTP
  # codes are silently dropped and phone registration/login is dead.
  SMS_ENABLED: 'true'
  SMS_API_BASE_URL: 'https://api.twilio.com/2010-04-01'

  # Payments: ArCa / Idram base URLs (API keys/merchant IDs/webhook secrets live
  # in api-secrets). Point these at the production gateways — confirm the exact
  # host with each provider; the sandbox hosts are sandbox.arca.am / test.wallet.idram.am.
  ARCA_BASE_URL: 'https://arca.am/api/v1'
  IDRAM_BASE_URL: 'https://banking.idram.am/api/v1'

  # Payments: Apple Pay / Google Pay. If *_TOKEN_EXCHANGE_URL is unset the API
  # falls back to LOCAL deterministic tokenization, which is DEV-ONLY and must
  # never be used in production — set both exchange URLs before going live.
  APPLE_PAY_MERCHANT_IDENTIFIER: 'merchant.com.lilocharge'
  APPLE_PAY_TOKEN_EXCHANGE_URL: 'https://REPLACE_ME.lilocharge.am/apple-pay/token-exchange'
  GOOGLE_PAY_MERCHANT_ID: 'REPLACE_WITH_GOOGLE_PAY_MERCHANT_ID'
  GOOGLE_PAY_TOKEN_EXCHANGE_URL: 'https://REPLACE_ME.lilocharge.am/google-pay/token-exchange'

  # Uploads (S3-compatible presigning). Endpoints 503 when these are unset; the
  # public base URL also gates review-photo validation. Keys live in api-secrets.
  UPLOADS_S3_ENDPOINT: 'https://s3.eu-central-1.amazonaws.com'
  UPLOADS_S3_REGION: 'eu-central-1'
  UPLOADS_S3_BUCKET: 'lilocharge-uploads'
  UPLOADS_PUBLIC_BASE_URL: 'https://uploads.lilocharge.am'

  # Push notifications (Firebase Admin service account). Enable in prod; the
  # service-account fields (project id / client email / private key) live in api-secrets.
  FCM_ENABLED: 'true'

  # Sessions / billing
  MINIMUM_SESSION_BALANCE_AMD: '1000'

  # Observability
  SENTRY_ENABLED: 'true'
  SENTRY_TRACES_SAMPLE_RATE: '0.1'
  OTEL_ENABLED: 'true'
  OTEL_SERVICE_NAME: 'lilocharge-api'
  OTEL_METRICS_PORT: '9464'
  # Trace export is a no-op while OTEL_TRACES_EXPORTER is 'none'. When an OTLP
  # collector is deployed, set this to 'otlp' and point the endpoint below at it
  # (remember to open egress to the collector — see network-policies.yaml).
  OTEL_TRACES_EXPORTER: 'none'
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: 'http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces'

  # Database settings (non-sensitive)
  POSTGRES_DB: 'lilocharge'
  POSTGRES_PORT: '5432'

  # Redis settings (non-sensitive)
  REDIS_PORT: '6379'

  # OCPP central-system WebSocket server
  OCPP_WS_ENABLED: 'true'
  OCPP_WS_PORT: '9220'
  # Charge-point authentication: open | allowlist | basic.
  # 'basic' (OCPP 1.6 security profile 1) requires the ocpp-identity-secrets key in api-secrets.
  OCPP_AUTH_MODE: 'basic'

  # Timezone
  TZ: 'Asia/Yerevan'
